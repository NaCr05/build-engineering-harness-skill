version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Maintenance pause: retain security-update plumbing but create no
    # scheduled version-update pull requests until active maintenance resumes.
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
