name: Validate repository

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: release-package-linux
          - os: windows-latest
            artifact_name: release-package-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Enforce append-only forward-test history
        if: github.event_name == 'pull_request'
        run: python scripts/check_append_only_runs.py --base-ref origin/${{ github.base_ref }}

      - name: Enforce changelog synchronization
        if: github.event_name == 'pull_request'
        run: python scripts/check_changelog.py --base-ref origin/${{ github.base_ref }}

      - name: Test the validator
        run: python -m unittest discover -s tests/static -v

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Build deterministic release package
        run: python scripts/build_release_package.py --output-dir .test-runs/release-package --source-commit ${{ github.sha }}

      - name: Smoke-test PowerShell safe installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "v$((Get-Content VERSION -Raw).Trim())"
          & .test-runs/release-package/install.ps1 -Version $version -AssetDir .test-runs/release-package -CodexHome .test-runs/isolated-codex-home -DryRun

      - name: Smoke-test POSIX safe installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="v$(tr -d '\r\n' < VERSION)"
          sh .test-runs/release-package/install.sh --version "$version" --asset-dir .test-runs/release-package --codex-home .test-runs/isolated-codex-home --dry-run

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: .test-runs/release-package/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  compatibility:
    name: Compatibility on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Test repository tooling
        run: python -m unittest discover -s tests/static -v

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Smoke-test macOS POSIX installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release_package.py --output-dir .test-runs/release-package --source-commit ${{ github.sha }}
          version="v$(tr -d '\r\n' < VERSION)"
          sh .test-runs/release-package/install.sh --version "$version" --asset-dir .test-runs/release-package --codex-home .test-runs/isolated-codex-home --dry-run

  compare-artifacts:
    name: Compare Windows and Linux release artifacts
    needs:
      - validate
      - compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-linux
          path: .test-runs/cross-platform/linux

      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-windows
          path: .test-runs/cross-platform/windows

      - name: Compare release packages byte for byte
        run: python scripts/compare_release_artifacts.py .test-runs/cross-platform/linux .test-runs/cross-platform/windows

  release-evidence:
    name: Validate release evidence
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compare-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate release evidence
        run: python scripts/validate_repository.py --release

  draft-release:
    name: Attest and create draft prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-linux
          path: dist

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Refusing to overwrite assets for published release $tag." >&2
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            release_flags=(--draft --verify-tag --generate-notes --title "$tag")
            if [[ "$tag" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$tag" dist/* "${release_flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi
