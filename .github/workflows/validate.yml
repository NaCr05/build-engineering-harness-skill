name: Validate repository

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test the validator
        run: python -m unittest discover -s tests/static -v

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Build deterministic release package
        run: python scripts/build_release_package.py --output-dir .test-runs/release-package --source-commit ${{ github.sha }}

  release-evidence:
    name: Validate release evidence
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release evidence
        run: python scripts/validate_repository.py --release

      - name: Build tagged release package
        run: python scripts/build_release_package.py --output-dir dist --source-commit ${{ github.sha }}
